[workspace]
members = ["cargo:."]

# Config for 'cargo-dist'
# Note: We use custom GitHub Actions workflow (.github/workflows/release.yml)
# to build macOS .app bundles with cargo-bundle
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.3"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
# Whether to auto-include files like README, LICENSE, CHANGELOG
auto-includes = true

[dist.github-ci]
build-plan = { targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"] }
