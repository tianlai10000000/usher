[package]
name = "usher-preview"
version = "0.0.9-alpha.1"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[features]
default = ["markdown", "image", "plain-text"]
markdown = [
    "dep:pulldown-cmark",
    "dep:tree-sitter",
    "dep:tree-sitter-bash",
    "dep:tree-sitter-go",
    "dep:tree-sitter-highlight",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-json",
    "dep:tree-sitter-python",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-typescript",
]
image = ["dep:image"]
plain-text = []

[dependencies]
image = { version = "0.25.10", optional = true, default-features = true }
pulldown-cmark = { version = "0.13.4", optional = true }
tree-sitter = { version = "0.27.0", optional = true }
tree-sitter-bash = { version = "0.25.1", optional = true }
tree-sitter-go = { version = "0.25.0", optional = true }
tree-sitter-highlight = { version = "0.27.0", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-json = { version = "0.24.8", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.189"
