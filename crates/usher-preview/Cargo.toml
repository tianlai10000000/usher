[package]
name = "usher-preview"
version = "0.0.8-alpha.1"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[features]
default = ["markdown", "image", "plain-text"]
markdown = ["dep:pulldown-cmark", "dep:syntect", "dep:tree-sitter-highlight", "dep:tree-sitter-javascript", "dep:tree-sitter-typescript", "dep:two-face"]
image = ["dep:image"]
plain-text = []

[dependencies]
image = { version = "0.25", optional = true, default-features = true }
pulldown-cmark = { version = "0.13", optional = true }
syntect = { version = "5.3", optional = true, default-features = false, features = ["default-fancy"] }
tree-sitter-highlight = { version = "0.26.12", optional = true }
tree-sitter-javascript = { version = "0.23.1", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
two-face = { version = "0.5", optional = true, default-features = false, features = ["syntect-fancy"] }
