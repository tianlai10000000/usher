[package]
name = "usher-ui"
version = "0.0.7-alpha.1"
edition = "2024"
publish = false
build = "build.rs"

[features]
default = ["renderer-femtovg"]
renderer-femtovg = ["slint/renderer-femtovg"]
renderer-femtovg-wgpu = ["slint/renderer-femtovg-wgpu"]
renderer-skia = ["slint/renderer-skia"]
live-preview = ["slint/live-preview"]

[dependencies]
slint = { version = "1.17.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "raw-window-handle-06", "unstable-fontique-010"] }

[build-dependencies]
slint-build = { version = "1.17.1" }
