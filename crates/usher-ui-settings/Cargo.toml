[package]
name = "usher-ui-settings"
version = "0.0.9-alpha.1"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false
build = "build.rs"

[features]
default = ["renderer-femtovg"]
renderer-femtovg = ["slint/renderer-femtovg"]
renderer-femtovg-wgpu = ["slint/renderer-femtovg-wgpu"]
renderer-skia = ["slint/renderer-skia"]
ai-code-review = []

[dependencies]
slint = { version = "1.18.0", default-features = false, features = ["std", "compat-1-2", "backend-winit", "raw-window-handle-06", "unstable-fontique-011"] }

[build-dependencies]
slint-build = { version = "1.18.0", features = ["experimental-module-builds"] }
usher-i18n = { path = "../usher-i18n" }
