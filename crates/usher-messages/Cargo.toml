[package]
name = "usher-messages"
version = "0.0.9-alpha.1"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false
build = "build.rs"

[features]
default = ["renderer-femtovg"]
renderer-femtovg = ["slint/renderer-femtovg"]
renderer-femtovg-wgpu = ["slint/renderer-femtovg-wgpu"]
renderer-skia = ["slint/renderer-skia"]

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
log = "0.4.34"
notify-rust = "4.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "raw-window-handle-06", "unstable-fontique-011"] }
usher-fs = { path = "../usher-fs" }
usher-state-store = { path = "../usher-state-store" }

[build-dependencies]
slint-build = { version = "1.18.1", features = ["experimental-module-builds"] }
usher-i18n = { path = "../usher-i18n" }
