name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  APP_NAME: Usher

jobs:
  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-
            ${{ runner.os }}-cargo-

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: target/
          key: ${{ runner.os }}-cargo-build-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ matrix.target }}-
            ${{ runner.os }}-cargo-build-

      - name: Install cargo-bundle
        run: |
          if ! command -v cargo-bundle &> /dev/null; then
            cargo install cargo-bundle
          fi

      - name: Install create-dmg
        run: |
          if ! command -v create-dmg &> /dev/null; then
            brew install create-dmg
          fi

      - name: Build Release
        run: cargo build --release --target ${{ matrix.target }} --jobs $(sysctl -n hw.ncpu)
        env:
          CARGO_INCREMENTAL: 0
          CARGO_NET_GIT_FETCH_WITH_CLI: true

      - name: Create App Bundle
        run: cargo bundle --release --target ${{ matrix.target }}

      - name: Create tar.gz for self_update
        run: |
          # 创建 tar.gz 压缩包供 self_update 使用
          # self_update 需要 tar.gz 格式，包含可执行文件
          TAR_NAME="${{ env.APP_NAME }}-${{ matrix.target }}.tar.gz"
          cd "target/${{ matrix.target }}/release"
          # 打包可执行文件
          tar -czf "../../../$TAR_NAME" usher
          cd ../../..
          echo "Created $TAR_NAME"

      - name: Create DMG Installer
        run: |
          # 创建 DMG 安装程序
          # 使用完整的 target triple 作为文件名，以便 self_update 能够正确识别
          DMG_NAME="${{ env.APP_NAME }}-${{ matrix.target }}.dmg"
          create-dmg \
            --volname "${{ env.APP_NAME }}" \
            --volicon "ui/slint-logo.svg" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "${{ env.APP_NAME }}.app" 175 178 \
            --hide-extension "${{ env.APP_NAME }}.app" \
            --app-drop-link 425 178 \
            --no-internet-enable \
            "$DMG_NAME" \
            "target/${{ matrix.target }}/release/bundle/osx/" \
          || true
          
          # 如果 create-dmg 失败，使用简单方式创建 DMG
          if [ ! -f "$DMG_NAME" ]; then
            hdiutil create -volname "${{ env.APP_NAME }}" \
              -srcfolder "target/${{ matrix.target }}/release/bundle/osx/${{ env.APP_NAME }}.app" \
              -ov -format UDZO \
              "$DMG_NAME"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-macos-${{ matrix.arch }}
          path: |
            ${{ env.APP_NAME }}-${{ matrix.target }}.tar.gz
            ${{ env.APP_NAME }}-${{ matrix.target }}.dmg

  release:
    name: Create Release
    needs: [build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f \( -name "*.dmg" -o -name "*.tar.gz" \)

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*.{dmg,tar.gz}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
