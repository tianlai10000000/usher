name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      cache_only:
        description: "Build caches only; run manually from the default branch"
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  APP_NAME: Usher
  CARGO_BUNDLE_VERSION: 0.12.0
  CREATE_DMG_VERSION: 1.3.0

jobs:
  build-macos:
    name: Build macOS App (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x64
    steps:
      - name: Validate cache prewarm ref
        if: github.event_name == 'workflow_dispatch' && inputs.cache_only
        shell: bash
        env:
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$RELEASE_DEFAULT_BRANCH" ]]; then
            echo "::error::Cache-only prewarming must run on the repository default branch."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Python for diagnostics
        continue-on-error: true
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Rust
        id: rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}

      - name: Restore Cargo registry
        id: registry-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: release-registry-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.github/workflows/release.yml') }}
          restore-keys: |
            release-registry-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-

      - name: Restore Release build
        id: build-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            target/.rustc_info.json
            target/release/
            target/${{ matrix.target }}/release/
          key: release-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ steps.rust.outputs.cachekey }}-release-default-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', '.github/workflows/release.yml') }}-${{ github.sha }}
          restore-keys: |
            release-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ steps.rust.outputs.cachekey }}-release-default-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', '.github/workflows/release.yml') }}-
            release-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ steps.rust.outputs.cachekey }}-release-default-

      - name: Record cache identity
        if: always()
        continue-on-error: true
        shell: bash
        run: python scripts/ci_release_metrics.py cache --output "release-diagnostics/${{ matrix.target }}/cache.json"
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          CACHE_IDENTITY: ${{ steps.build-cache.outputs.cache-primary-key }}
          REGISTRY_CACHE_HIT: ${{ steps.registry-cache.outputs.cache-hit }}
          REGISTRY_CACHE_MATCHED_KEY: ${{ steps.registry-cache.outputs.cache-matched-key }}
          REGISTRY_CACHE_OUTCOME: ${{ steps.registry-cache.outcome }}
          BUILD_CACHE_HIT: ${{ steps.build-cache.outputs.cache-hit }}
          BUILD_CACHE_MATCHED_KEY: ${{ steps.build-cache.outputs.cache-matched-key }}
          BUILD_CACHE_OUTCOME: ${{ steps.build-cache.outcome }}

      - name: Install cargo-bundle
        if: ${{ !inputs.cache_only }}
        run: |
          if [[ "$(cargo-bundle --version 2>/dev/null || true)" != "cargo-bundle v${CARGO_BUNDLE_VERSION}" ]]; then
            cargo install cargo-bundle --version "${CARGO_BUNDLE_VERSION}" --locked
          fi

      - name: Install create-dmg
        if: ${{ !inputs.cache_only }}
        run: |
          if [[ "$(create-dmg --version 2>/dev/null || true)" != "create-dmg ${CREATE_DMG_VERSION}" ]]; then
            if brew list --versions create-dmg >/dev/null 2>&1; then
              brew upgrade create-dmg
            else
              brew install create-dmg
            fi
          fi
          test "$(create-dmg --version)" = "create-dmg ${CREATE_DMG_VERSION}"

      - name: Build Release
        id: release-build
        run: cargo build --release --target ${{ matrix.target }} --jobs $(sysctl -n hw.ncpu) --timings --locked
        env:
          CARGO_INCREMENTAL: 0
          CARGO_NET_GIT_FETCH_WITH_CLI: true

      # Save unsigned compiler output before bundling/signing, with the same restore identity.
      - name: Save Cargo registry
        if: success() && steps.release-build.outcome == 'success' && steps.registry-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ steps.registry-cache.outputs.cache-primary-key }}

      - name: Save Release build
        if: success() && steps.release-build.outcome == 'success' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            target/.rustc_info.json
            target/release/
            target/${{ matrix.target }}/release/
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Create App Bundle
        if: ${{ !inputs.cache_only }}
        run: cargo bundle --release --format osx --target ${{ matrix.target }}

      - name: Install Apple signing certificate
        if: ${{ !inputs.cache_only && startsWith(github.ref, 'refs/tags/') && vars.MACOS_SIGNING_NOTARIZATION_ENABLED == 'true' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          test -n "$BUILD_CERTIFICATE_BASE64" || { echo "MACOS_CERTIFICATE_BASE64 is required for tag releases"; exit 1; }
          test -n "$P12_PASSWORD" || { echo "MACOS_CERTIFICATE_PASSWORD is required for tag releases"; exit 1; }
          test -n "$KEYCHAIN_PASSWORD" || { echo "MACOS_KEYCHAIN_PASSWORD is required for tag releases"; exit 1; }
          CERTIFICATE_PATH="$RUNNER_TEMP/usher-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/usher-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Sign macOS executable and app bundle
        if: ${{ !inputs.cache_only && startsWith(github.ref, 'refs/tags/') && vars.MACOS_SIGNING_NOTARIZATION_ENABLED == 'true' }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          test -n "$APPLE_SIGNING_IDENTITY" || { echo "APPLE_SIGNING_IDENTITY is required for tag releases"; exit 1; }
          EXE_PATH="target/${{ matrix.target }}/release/usher"
          BUNDLE_PATH="target/${{ matrix.target }}/release/bundle/osx/${{ env.APP_NAME }}.app"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$EXE_PATH"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$BUNDLE_PATH"
          codesign --verify --deep --strict --verbose=2 "$BUNDLE_PATH"

      - name: Create tar.gz for self_update
        if: ${{ !inputs.cache_only }}
        run: |
          # 创建三个 tar.gz 文件：
          # 1. 只包含可执行文件（用于 self_update 自动更新）
          # 2. 包含整个 .app bundle（用于手动安装，解压后可直接使用）
          # 3. 只包含可执行文件（用于调试/查看日志，直接运行会显示终端窗口）
          
          EXE_PATH="target/${{ matrix.target }}/release/usher"
          BUNDLE_PATH="target/${{ matrix.target }}/release/bundle/osx/${{ env.APP_NAME }}.app"
          
          # 检查文件是否存在
          if [ ! -f "$EXE_PATH" ]; then
            echo "Error: Executable not found at $EXE_PATH"
            exit 1
          fi
          
          if [ ! -d "$BUNDLE_PATH" ]; then
            echo "Error: App bundle not found at $BUNDLE_PATH"
            exit 1
          fi
          
          # 1. 创建只包含可执行文件的 tar.gz（用于 self_update）
          TAR_EXE_NAME="${{ env.APP_NAME }}-${{ matrix.target }}.tar.gz"
          tar -czf "$TAR_EXE_NAME" -C "target/${{ matrix.target }}/release" usher
          
          if [ ! -f "$TAR_EXE_NAME" ]; then
            echo "Error: Failed to create $TAR_EXE_NAME"
            exit 1
          fi
          
          echo "Created $TAR_EXE_NAME ($(du -h "$TAR_EXE_NAME" | cut -f1)) - for self_update"
          
          # 2. 创建包含整个 .app bundle 的 tar.gz（用于手动安装）
          TAR_BUNDLE_NAME="${{ env.APP_NAME }}-${{ matrix.target }}-bundle.tar.gz"
          tar -czf "$TAR_BUNDLE_NAME" -C "target/${{ matrix.target }}/release/bundle/osx" "${{ env.APP_NAME }}.app"
          
          if [ ! -f "$TAR_BUNDLE_NAME" ]; then
            echo "Error: Failed to create $TAR_BUNDLE_NAME"
            exit 1
          fi
          
          echo "Created $TAR_BUNDLE_NAME ($(du -h "$TAR_BUNDLE_NAME" | cut -f1)) - for manual install"
          
          # 3. 创建只包含可执行文件的 tar.gz（用于调试/查看日志）
          # 这个版本可以直接运行，会显示终端窗口，方便查看运行日志
          TAR_DEBUG_NAME="${{ env.APP_NAME }}-${{ matrix.target }}-debug.tar.gz"
          tar -czf "$TAR_DEBUG_NAME" -C "target/${{ matrix.target }}/release" usher
          
          if [ ! -f "$TAR_DEBUG_NAME" ]; then
            echo "Error: Failed to create $TAR_DEBUG_NAME"
            exit 1
          fi
          
          echo "Created $TAR_DEBUG_NAME ($(du -h "$TAR_DEBUG_NAME" | cut -f1)) - for debug/terminal mode"
          
          # 验证文件
          echo ""
          echo "Verifying tar.gz files:"
          ls -lh "$TAR_EXE_NAME" "$TAR_BUNDLE_NAME" "$TAR_DEBUG_NAME"
          echo ""
          echo "Contents of $TAR_EXE_NAME (for self_update):"
          tar -tzf "$TAR_EXE_NAME"
          echo ""
          echo "Contents of $TAR_BUNDLE_NAME (for manual install, first 10 entries):"
          tar -tzf "$TAR_BUNDLE_NAME" | head -10
          echo ""
          echo "Contents of $TAR_DEBUG_NAME (for debug/terminal, same as self_update):"
          tar -tzf "$TAR_DEBUG_NAME"

      - name: Create DMG Installer
        if: ${{ !inputs.cache_only }}
        run: |
          # 创建 DMG 安装程序
          # 使用完整的 target triple 作为文件名，以便 self_update 能够正确识别
          DMG_NAME="${{ env.APP_NAME }}-${{ matrix.target }}.dmg"
          BUNDLE_PATH="target/${{ matrix.target }}/release/bundle/osx/${{ env.APP_NAME }}.app"
          
          # 检查 bundle 是否存在
          if [ ! -d "$BUNDLE_PATH" ]; then
            echo "Error: App bundle not found at $BUNDLE_PATH"
            exit 1
          fi
          
          # 尝试使用 create-dmg 创建
          create-dmg \
            --volname "${{ env.APP_NAME }}" \
            --volicon "ui/slint-logo.svg" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "${{ env.APP_NAME }}.app" 175 178 \
            --hide-extension "${{ env.APP_NAME }}.app" \
            --app-drop-link 425 178 \
            --no-internet-enable \
            "$DMG_NAME" \
            "target/${{ matrix.target }}/release/bundle/osx/" \
          || {
            echo "create-dmg failed, trying hdiutil..."
            # 如果 create-dmg 失败，使用简单方式创建 DMG
            hdiutil create -volname "${{ env.APP_NAME }}" \
              -srcfolder "$BUNDLE_PATH" \
              -ov -format UDZO \
              "$DMG_NAME"
          }
          
          # 验证文件已创建
          if [ ! -f "$DMG_NAME" ]; then
            echo "Error: Failed to create $DMG_NAME"
            exit 1
          fi
          
          echo "Created $DMG_NAME ($(du -h "$DMG_NAME" | cut -f1))"
          ls -lh "$DMG_NAME"

      - name: Verify artifacts before upload
        if: ${{ !inputs.cache_only }}
        run: |
          echo "Checking artifacts..."
          ls -lh "${{ env.APP_NAME }}-${{ matrix.target }}.tar.gz" || echo "tar.gz not found!"
          ls -lh "${{ env.APP_NAME }}-${{ matrix.target }}.dmg" || echo "dmg not found!"
          echo "Current directory: $(pwd)"
          echo "Files in current directory:"
          ls -lh | grep -E "\.(tar\.gz|dmg)$" || echo "No matching files found"

      - name: Notarize and staple DMG
        if: ${{ !inputs.cache_only && startsWith(github.ref, 'refs/tags/') && vars.MACOS_SIGNING_NOTARIZATION_ENABLED == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          test -n "$APPLE_ID" || { echo "APPLE_ID is required for tag releases"; exit 1; }
          test -n "$APPLE_TEAM_ID" || { echo "APPLE_TEAM_ID is required for tag releases"; exit 1; }
          test -n "$APPLE_APP_PASSWORD" || { echo "APPLE_APP_PASSWORD is required for tag releases"; exit 1; }
          DMG_NAME="${{ env.APP_NAME }}-${{ matrix.target }}.dmg"
          xcrun notarytool submit "$DMG_NAME" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG_NAME"
          xcrun stapler validate "$DMG_NAME"

      - name: Remove temporary signing keychain
        if: ${{ always() && !inputs.cache_only && startsWith(github.ref, 'refs/tags/') && vars.MACOS_SIGNING_NOTARIZATION_ENABLED == 'true' }}
        run: security delete-keychain "$RUNNER_TEMP/usher-signing.keychain-db" || true

      - name: Upload Artifacts
        if: ${{ !inputs.cache_only }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.APP_NAME }}-macos-${{ matrix.arch }}
          path: |
            ${{ env.APP_NAME }}-${{ matrix.target }}.tar.gz
            ${{ env.APP_NAME }}-${{ matrix.target }}-bundle.tar.gz
            ${{ env.APP_NAME }}-${{ matrix.target }}-debug.tar.gz
            ${{ env.APP_NAME }}-${{ matrix.target }}.dmg
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-diagnostics-${{ matrix.target }}-attempt-${{ github.run_attempt }}
          path: |
            release-diagnostics/${{ matrix.target }}/cache.json
            target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 14

  build-windows:
    name: Build Windows App (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
    steps:
      - name: Validate cache prewarm ref
        if: github.event_name == 'workflow_dispatch' && inputs.cache_only
        shell: bash
        env:
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$RELEASE_DEFAULT_BRANCH" ]]; then
            echo "::error::Cache-only prewarming must run on the repository default branch."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Python for diagnostics
        continue-on-error: true
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Rust
        id: rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}

      - name: Restore Cargo registry
        id: registry-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: release-registry-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.github/workflows/release.yml') }}
          restore-keys: |
            release-registry-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-

      - name: Restore Release build
        id: build-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            target/.rustc_info.json
            target/release/
            target/${{ matrix.target }}/release/
          key: release-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ steps.rust.outputs.cachekey }}-release-default-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', '.github/workflows/release.yml') }}-${{ github.sha }}
          restore-keys: |
            release-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ steps.rust.outputs.cachekey }}-release-default-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', '.github/workflows/release.yml') }}-
            release-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ steps.rust.outputs.cachekey }}-release-default-

      - name: Record cache identity
        if: always()
        continue-on-error: true
        shell: bash
        run: python scripts/ci_release_metrics.py cache --output "release-diagnostics/${{ matrix.target }}/cache.json"
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          CACHE_IDENTITY: ${{ steps.build-cache.outputs.cache-primary-key }}
          REGISTRY_CACHE_HIT: ${{ steps.registry-cache.outputs.cache-hit }}
          REGISTRY_CACHE_MATCHED_KEY: ${{ steps.registry-cache.outputs.cache-matched-key }}
          REGISTRY_CACHE_OUTCOME: ${{ steps.registry-cache.outcome }}
          BUILD_CACHE_HIT: ${{ steps.build-cache.outputs.cache-hit }}
          BUILD_CACHE_MATCHED_KEY: ${{ steps.build-cache.outputs.cache-matched-key }}
          BUILD_CACHE_OUTCOME: ${{ steps.build-cache.outcome }}

      - name: Build Release
        id: release-build
        shell: bash
        run: cargo build --release --target ${{ matrix.target }} --timings --locked
        env:
          CARGO_INCREMENTAL: 0
          CARGO_NET_GIT_FETCH_WITH_CLI: true

      # Save unsigned compiler output before bundling/signing, with the same restore identity.
      - name: Save Cargo registry
        if: success() && steps.release-build.outcome == 'success' && steps.registry-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ steps.registry-cache.outputs.cache-primary-key }}

      - name: Save Release build
        if: success() && steps.release-build.outcome == 'success' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            target/.rustc_info.json
            target/release/
            target/${{ matrix.target }}/release/
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Create zip artifacts
        if: ${{ !inputs.cache_only }}
        shell: pwsh
        run: |
          $exePath = "target/${{ matrix.target }}/release/usher.exe"
          if (-not (Test-Path $exePath)) {
            throw "Executable not found at $exePath"
          }

          $selfZip = "${{ env.APP_NAME }}-${{ matrix.target }}.zip"
          $bundleZip = "${{ env.APP_NAME }}-${{ matrix.target }}-bundle.zip"
          $debugZip = "${{ env.APP_NAME }}-${{ matrix.target }}-debug.zip"

          $stagingRoot = Join-Path $pwd "staging"
          Remove-Item $stagingRoot -Recurse -Force -ErrorAction SilentlyContinue

          $selfDir = Join-Path $stagingRoot "self"
          $bundleDir = Join-Path $stagingRoot "bundle"
          $debugDir = Join-Path $stagingRoot "debug"
          New-Item -ItemType Directory -Path $selfDir, $bundleDir, $debugDir | Out-Null

          Copy-Item $exePath (Join-Path $selfDir "usher.exe")
          Copy-Item $exePath (Join-Path $debugDir "usher.exe")
          Copy-Item $exePath (Join-Path $bundleDir "usher.exe")

          if (Test-Path "logo.png") {
            Copy-Item "logo.png" (Join-Path $bundleDir "logo.png")
          }

          @"
          Usher Windows Bundle
          ====================
          1) 直接运行 usher.exe
          2) 如果启动报缺少 DLL，请补齐依赖到同目录后重试
          3) 若托盘图标异常，请确认 logo.png 存在
          "@ | Set-Content -Path (Join-Path $bundleDir "README.txt")

          Compress-Archive -Path (Join-Path $selfDir "*") -DestinationPath $selfZip -Force
          Compress-Archive -Path (Join-Path $bundleDir "*") -DestinationPath $bundleZip -Force
          Compress-Archive -Path (Join-Path $debugDir "*") -DestinationPath $debugZip -Force

          Get-Item $selfZip, $bundleZip, $debugZip | Format-Table Name, Length

      - name: Upload Artifacts
        if: ${{ !inputs.cache_only }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.APP_NAME }}-windows-${{ matrix.arch }}
          path: |
            ${{ env.APP_NAME }}-${{ matrix.target }}.zip
            ${{ env.APP_NAME }}-${{ matrix.target }}-bundle.zip
            ${{ env.APP_NAME }}-${{ matrix.target }}-debug.zip
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-diagnostics-${{ matrix.target }}-attempt-${{ github.run_attempt }}
          path: |
            release-diagnostics/${{ matrix.target }}/cache.json
            target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Create Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: ${{ !inputs.cache_only && startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          pattern: ${{ env.APP_NAME }}-*

      - name: List artifacts
        run: |
          echo "Artifacts directory structure:"
          find artifacts -type f -o -type d | head -20
          echo ""
          echo "Looking for release files:"
          find artifacts -type f \( -name "*.dmg" -o -name "*.tar.gz" -o -name "*.zip" \) || echo "No matching files found!"
          echo ""
          echo "All files:"
          find artifacts -type f || echo "No files found!"
          echo ""
          echo "File summary:"
          echo "- *.tar.gz: 用于 self_update 自动更新（只包含可执行文件）"
          echo "- *-bundle.tar.gz: 用于手动安装（包含完整 .app bundle，解压后可直接使用）"
          echo "- *-debug.tar.gz: 用于调试/查看日志（只包含可执行文件，直接运行会显示终端窗口）"
          echo "- *.dmg: 用于手动安装（macOS 安装镜像）"
          echo "- *.zip: 用于 Windows 分发（self_update/手动安装/调试）"

      - name: Prepare release files
        run: |
          # 创建 release_files 目录并复制所有匹配的文件
          mkdir -p release_files
          find artifacts -type f \( -name "*.dmg" -o -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release_files/ \;
          echo "Release files prepared:"
          ls -lh release_files/ || echo "No files in release_files!"
          echo ""
          echo "文件说明:"
          echo "  - *-{target}.tar.gz: 用于 self_update 自动更新（只包含可执行文件）"
          echo "  - *-{target}-bundle.tar.gz: 用于手动安装（包含完整 .app bundle，解压后可直接使用）"
          echo "  - *-{target}-debug.tar.gz: 用于调试/查看日志（只包含可执行文件，直接运行会显示终端窗口）"
          echo "  - *-{target}.dmg: 用于手动安装（macOS 安装镜像）"
          echo "  - *-{target}.zip: 用于 Windows self_update 自动更新"
          echo "  - *-{target}-bundle.zip: 用于 Windows 手动安装（包含 exe + 资源）"
          echo "  - *-{target}-debug.zip: 用于 Windows 调试/查看日志"

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: release_files/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  report-timings:
    name: Release timing report
    needs: [build-macos, build-windows, release]
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Python for diagnostics
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Collect current attempt job and step timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            > "$RUNNER_TEMP/release-jobs.json"
          python scripts/ci_release_metrics.py jobs \
            --input "$RUNNER_TEMP/release-jobs.json" \
            --output-dir release-timings \
            --attempt "$GITHUB_RUN_ATTEMPT"
          cat release-timings/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload stage timings
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-stage-timings-attempt-${{ github.run_attempt }}
          path: release-timings/
          if-no-files-found: warn
          retention-days: 14
