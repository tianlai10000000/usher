[alias]
ide-check = "check --workspace --all-targets --profile ide --locked"

[env]
# Slint 1.17's ComponentContainer/component-factory pair is still gated as an
# experimental language feature. Usher uses it only for explicit cross-crate
# page boundaries; keep every Cargo-driven compiler/runtime invocation aligned.
SLINT_ENABLE_EXPERIMENTAL_FEATURES = "1"

[target.x86_64-pc-windows-msvc]
# Increase default stack size to avoid running out of stack
# space in debug builds. The size matches Linux's default.
rustflags = [
    "-C", "link-arg=/STACK:8000000"
]
[target.aarch64-pc-windows-msvc]
# Increase default stack size to avoid running out of stack
# space in debug builds. The size matches Linux's default.
rustflags = [
    "-C", "link-arg=/STACK:8000000"
]

# 注意：live-preview 配置已移除以减小 release 构建体积
# 如需在开发时使用 live-preview，可以临时取消下面的注释
# [build]
# rustflags = ["--cfg", "slint_live_preview"]
