[package]
name = "usher"
version = "0.0.9-alpha.4"
edition = "2024"
repository = "https://github.com/tianlai10000000/usher"
authors = ["yuankai <tanlai10000000@gmail.com>"]
license = "LicenseRef-Proprietary"
publish = false

[workspace]
members = [".", "crates/usher-ai-review", "crates/usher-fs", "crates/usher-i18n", "crates/usher-messages", "crates/usher-preview", "crates/usher-search", "crates/usher-state-store", "crates/usher-ui", "crates/usher-ui-settings", "crates/usher-virtual-list"]
default-members = ["."]
exclude = ["dpi-flicker-repro"]
resolver = "3"

[lib]
path = "src/lib.rs"
name = "usher_lib"

[features]
# Production builds use one deterministic renderer. Skia remains available for
# diagnostics and renderer comparisons without being linked into normal builds.
default = ["renderer-femtovg", "ai-code-review"]
renderer-femtovg = ["slint/renderer-femtovg", "usher-messages/renderer-femtovg", "usher-ui/renderer-femtovg", "usher-ui-settings/renderer-femtovg"]
renderer-femtovg-wgpu = ["slint/renderer-femtovg-wgpu", "usher-messages/renderer-femtovg-wgpu", "usher-ui/renderer-femtovg-wgpu", "usher-ui-settings/renderer-femtovg-wgpu"]
renderer-skia = ["slint/renderer-skia", "usher-messages/renderer-skia", "usher-ui/renderer-skia", "usher-ui-settings/renderer-skia"]
# Development-only in-process UI hot reload. Production builds must leave this
# feature disabled so the live-preview interpreter and watcher are not built.
live-preview = ["slint/live-preview", "usher-ui/live-preview"]
# Development-only component playground. Keep this out of the default feature
# set so normal and production builds do not compile the large showcase page.
ui-components = ["usher-ui/ui-components", "test-fixtures"]
# Development-only shell build. The PR Review feature package is replaced by
# a protocol-compatible empty implementation to keep unrelated UI iteration
# out of its large generated render tree. Default and release builds omit it.
dev-shell = ["usher-ui/dev-shell"]
# Opt-in local fixtures used for manual UI acceptance. Normal and production
# builds do not compile the fixture bridge or embed its data.
test-fixtures = ["slint/unstable-winit-030"]
# Headless AI review engine plus its optional application UI/settings bridges.
# `--no-default-features --features renderer-femtovg` keeps the complete feature
# out of the compile graph for constrained or comparison builds.
ai-code-review = ["dep:usher-ai-review", "usher-ui/ai-code-review", "usher-ui-settings/ai-code-review"]

[[bin]]
path = "src/main.rs"
name = "usher"

[[example]]
name = "pr_approval_state_fixture"
path = "examples/pr_approval_state_fixture.rs"
required-features = ["test-fixtures"]

[dependencies]
# "backend-android-activity-06",
# 生产构建只启用 FemtoVG/OpenGL。Skia 与 FemtoVG/WGPU 仅用于显式诊断构建：
#   SLINT_BACKEND=winit-skia cargo run --no-default-features --features renderer-skia
#   SLINT_BACKEND=winit-femtovg-wgpu cargo run --no-default-features --features renderer-femtovg-wgpu
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "raw-window-handle-06", "unstable-fontique-011"] }
i-slint-core = "=1.18.1"
usher-ui = { path = "crates/usher-ui", default-features = false }
usher-ui-settings = { path = "crates/usher-ui-settings", default-features = false }
usher-fs = { path = "crates/usher-fs" }
usher-i18n = { path = "crates/usher-i18n" }
usher-messages = { path = "crates/usher-messages", default-features = false }
usher-preview = { path = "crates/usher-preview" }
usher-ai-review = { path = "crates/usher-ai-review", optional = true }
usher-state-store = { path = "crates/usher-state-store" }
usher-search = { path = "crates/usher-search" }
usher-virtual-list = { path = "crates/usher-virtual-list" }
parley = "0.11.1"
lazy_static = "1.5.0"
log = "0.4.34"
fern = { version = "0.7.1", features = ["colored"] }
chrono = "0.4.45"
self_update = { version = "1.3.0", default-features = false, features = ["reqwest", "github", "archive-tar", "archive-zip", "compression-tar-gz", "compression-zip-deflate", "rustls"] }
self-replace = "1.5.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util", "net"] }
anyhow = "1.0.104"
async-trait = "0.1.92"
bytes = "1.12.1"
crossbeam-channel = "0.5.17"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "stream", "system-proxy"] }
semver = "1.0.28"
futures-util = "0.3.34"
tar = "0.4.46"
flate2 = "1.1.10"
tray-icon = "0.26.0"
image = "0.25.10"
resvg = { version = "0.48.1", default-features = false, features = ["text", "raster-images"] }
pulldown-cmark = "0.13.4"
config = { version = "0.15.27", default-features = false, features = ["toml"] }
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
webbrowser = "1.2.4"
toml = "1.1.6"  # 用于 TOML 序列化
minijinja = { version = "2.24.0", default-features = false }
arboard = "3.6.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "std"] }
rand = "0.10.3"
signal-hook = "0.4.4"
fs2 = "0.4.3"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
portable-pty = "0.9.0"
vt100 = "0.16.2"
libc = "0.2.189"
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6.2"
objc = "0.2.7"
block2 = "0.6.2"
core-foundation = "0.10.1"
system-configuration = "0.8.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_IO"] }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
# Native system-theme detection. On Linux this uses the XDG Desktop Portal,
# which also works inside Flatpak sandboxes; Windows reads the per-user app theme.
dark-light = { version = "3.0.0", default-features = false }

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"

[build-dependencies]
usher-i18n = { path = "crates/usher-i18n" }

# [target.'cfg(target_arch = "wasm32")'.dependencies]
# wasm-bindgen = { version = "0.2" }
# console_error_panic_hook = "0.1.5"

# [package.metadata.android]
# package = "dev.slint.material_template"
# apk_name = "usher"

# [package.metadata.android.application]
# label = "Usher"

# macOS .app bundle 配置
[package.metadata.bundle]
name = "Usher"
identifier = "com.usher.app"
icon = ["logo.png"]  # 需要 PNG 或 ICNS 格式的图标
resources = ["logo.png"]  # 将 logo.png 复制到 .app/Contents/Resources/ 用于托盘图标
category = "Utility"
short_description = "Usher Application"
long_description = "A modern desktop application built with Slint"

[package.metadata.bundle.osx]
minimum_system_version = "10.14"

# Keep everyday macOS builds compact without giving up incremental compilation.
# Cargo otherwise defaults to full + unpacked debug info on macOS, which retains
# thousands of loose rustc codegen objects in target/debug/deps.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "off"
incremental = true

# Optimize third-party dependencies without changing application-owned Rust's
# opt0 source-debugging behavior.
[profile.dev.package."*"]
opt-level = 1

# Generated Slint code is not a useful LLDB source surface. Keep line tables for
# application-owned Rust while avoiding debug metadata for the very large UI crate.
[profile.dev.package.usher-ui]
debug = "none"
opt-level = 1

[profile.dev.package.usher-ui-settings]
debug = "none"
opt-level = 1

[profile.dev.package.usher-messages]
debug = "none"
opt-level = 1

[profile.test]
debug = "line-tables-only"
split-debuginfo = "off"
incremental = true

[profile.test.package.usher-ui]
debug = "none"

[profile.test.package.usher-ui-settings]
debug = "none"

[profile.test.package.usher-messages]
debug = "none"

# IDE background analysis checks every workspace target frequently. Keep those
# disposable artifacts small and stable instead of duplicating dev incremental
# caches. Command-line build/run/test workflows continue to use dev/test.
[profile.ide]
inherits = "dev"
debug = "none"
incremental = false

# Opt in when full LLDB variable/type inspection is required. Packed symbols
# keep this heavyweight profile isolated from the normal dev artifact layout.
[profile.dev-full]
inherits = "dev"
debug = "full"
split-debuginfo = "packed"

[profile.release]
strip = true  # Automatically strip symbols from the binary.
opt-level = "z"  # Optimize for size.
lto = true  # Link-time optimization for smaller binaries
codegen-units = 1  # Better optimization at cost of compile time
panic = "abort"  # Reduce binary size by using abort instead of unwind
debug = false  # No debug info in release builds
incremental = false  # Disable incremental compilation for release

# Optimized local builds keep the release runtime policy while trading some
# whole-program optimization for shorter rebuilds. Final artifacts continue to
# use `--release` and the profile above.
[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 8
incremental = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[patch.crates-io]
# Temporary upstream override for the opt-in development live preview only.
# See vendor/i-slint-live-preview/USHER_PATCHES.md.
i-slint-live-preview = { path = "vendor/i-slint-live-preview" }
