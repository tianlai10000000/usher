[package]
name = "usher"
version = "0.0.6-alpha.3"
edition = "2024"
repository = "https://github.com/tianlai10000000/usher"
authors = ["yuankai <tanlai10000000@gmail.com>"]

[lib]
crate-type = ["lib", "cdylib"]
path = "src/lib.rs"
name = "usher_lib"

[[bin]]
path = "src/main.rs"
name = "usher"

[dependencies]
# "backend-android-activity-06",
# 注意：live-preview feature 已移除以减小 release 构建体积
# 如需开发时使用 live-preview，可以临时添加 features = ["live-preview"]
slint = { version = "1.15.0", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "raw-window-handle-06"] }
lazy_static = "1.4"
log = "0.4"
fern = { version = "0.7", features = ["colored"] }
chrono = "0.4"
self_update = { version = "0.41.0", features = ["archive-tar", "archive-zip", "compression-flate2", "rustls"] }
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
reqwest = { version = "0.12", features = ["rustls-tls", "stream"] }
semver = "1.0.27"
futures-util = "0.3.31"
tar = "0.4"
flate2 = "1.0"
tray-icon = "0.12"
image = "0.25"
config = "0.14.0"
directories = "5.0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pulldown-cmark = "0.13"
webbrowser = "1.0"
toml = "0.8"  # 用于 TOML 序列化
arboard = "3.6.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "std"] }
rand = "0.9.2"
signal-hook = "0.4.3"
fs2 = "0.4.3"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
objc = "0.2"

# [target.'cfg(target_arch = "wasm32")'.dependencies]
# wasm-bindgen = { version = "0.2" }
# console_error_panic_hook = "0.1.5"

[build-dependencies]
slint-build = { version = "1.14"  }

# [package.metadata.android]
# package = "dev.slint.material_template"
# apk_name = "usher"

# [package.metadata.android.application]
# label = "Usher"

# macOS .app bundle 配置
[package.metadata.bundle]
name = "Usher"
identifier = "com.usher.app"
icon = ["logo.png"]  # 需要 PNG 或 ICNS 格式的图标
resources = ["logo.png"]  # 将 logo.png 复制到 .app/Contents/Resources/ 用于托盘图标
category = "Utility"
short_description = "Usher Application"
long_description = "A modern desktop application built with Slint"
osx_minimum_system_version = "10.14"

[profile.release]
strip = true  # Automatically strip symbols from the binary.
opt-level = "z"  # Optimize for size.
lto = true  # Link-time optimization for smaller binaries
codegen-units = 1  # Better optimization at cost of compile time
panic = "abort"  # Reduce binary size by using abort instead of unwind
debug = false  # No debug info in release builds
incremental = false  # Disable incremental compilation for release

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
